<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Samuel López Melián">
  <title>Densidad: cambio de unidades</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Densidad: cambio de unidades</h1>

    <div class="layout">
      <section class="card" aria-label="Actividad">
        <div id="counter" class="counter"></div>

        <div
          id="progress"
          class="progress"
          role="progressbar"
          aria-label="Ejercicios completados"
          aria-valuemin="0"
          aria-valuemax="3"
          aria-valuenow="0"
        >
          <div id="bar"></div>
        </div>

        <div id="exercise"></div>
      </section>

      <aside class="card calculator">
        <h2>Calculadora</h2>
        <output id="screen" aria-live="polite">0</output>
        <div id="keys" class="keys"></div>
      </aside>
    </div>
  </main>

  <footer>
    Autor: Samuel López Melián
  </footer>
</body>
</html>
